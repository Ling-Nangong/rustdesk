# 只构建 Android arm64 APK 的最小流水线。
# 用途：验证 hwcodec.rs 的 Android mediacodec 硬解注册改动。
# 与上游 flutter-build.yml 的差异：只跑 aarch64、用 debug 签名、不发布 release。
name: build-android-mcfix

on:
  # NOTE: 已停用 push 自动触发（2026-11-23）。原因：一轮 25~28 分钟，且经常在
  # 环境依赖上翻车（jcenter 停服、Maven TLS 被掐、vcpkg 缓存未命中等）。
  # 本地交叉编译链路已打通（libsodium.a 自建 + 阿里云 Maven 镜像），改 Rust 后
  # 本地增量编译 2~3 分钟即可出 .so，不必再等 CI。
  # 保留 workflow_dispatch，仅在需要干净环境复核时才手动触发。
  workflow_dispatch:

env:
  RUST_VERSION: "1.75"
  CARGO_NDK_VERSION: "3.1.2"
  ANDROID_FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  NDK_VERSION: "r28c"
  VERSION: "1.5.3"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-arm64:
    needs: [generate-bridge]
    runs-on: ubuntu-24.04
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
               clang cmake curl gcc-multilib git g++ g++-multilib \
               libc6-dev libclang-dev libunwind-dev llvm-dev \
               nasm ninja-build openjdk-17-jdk-headless pkg-config tree wget unzip

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.ANDROID_FLUTTER_VERSION }}

      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: bash
        run: |
          if ! ./flutter/build_android_deps.sh arm64-v8a; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo ""
            done
            exit 1
          fi

      # 把编好的 arm64-android 依赖树导出，供 Windows 本地构建复用。
      # 这样本地永远不需要在 Windows 上跑 vcpkg 交叉编译 ffmpeg（那是整条链路最脆的一环）。
      # hwcodec/build.rs 只要求 $VCPKG_ROOT/installed/arm64-android/{lib,include} 存在。
      - name: Export vcpkg android libs for local build
        shell: bash
        run: |
          ROOT="${VCPKG_ROOT}/installed/arm64-android"
          test -d "$ROOT/lib"  || { echo "missing $ROOT/lib"; exit 1; }
          test -d "$ROOT/include" || { echo "missing $ROOT/include"; exit 1; }
          mkdir -p /tmp/vcpkg-export
          tar -czf /tmp/vcpkg-export/vcpkg-arm64-android.tar.gz -C "$ROOT" lib include
          ls -lh /tmp/vcpkg-export/

      - name: Upload vcpkg android libs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vcpkg-arm64-android
          path: /tmp/vcpkg-export/vcpkg-arm64-android.tar.gz

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: rustdesk-lib-cache-android
          key: aarch64-linux-android

      - name: Build rustdesk lib
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked
          ./flutter/ndk_arm64.sh
          mkdir -p ./flutter/android/app/src/main/jniLibs/arm64-v8a
          cp ./target/aarch64-linux-android/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so

      - name: Upload Rustdesk library to Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: librustdesk.so.aarch64-linux-android
          path: ./target/aarch64-linux-android/release/liblibrustdesk.so

      - name: Build APK
        shell: bash
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH
          sed -i "s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g" ./flutter/android/gradle.properties
          # 上游 CI 同样用 debug 签名，避免依赖 keystore secret
          sed -i "s/signingConfigs.release/signingConfigs.debug/g" ./flutter/android/app/build.gradle
          cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/
          pushd flutter
          flutter build apk --release --target-platform android-arm64 --split-per-abi
          popd
          mkdir -p out
          cp ./flutter/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ./out/rustdesk-${{ env.VERSION }}-mcfix-arm64.apk
          ls -lh ./out/

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustdesk-mcfix-arm64-apk
          path: ./out/rustdesk-${{ env.VERSION }}-mcfix-arm64.apk
